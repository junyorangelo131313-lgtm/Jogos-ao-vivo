<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f1638">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: capacitor: http://localhost; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Jogos ao Vivo</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Aplica o tema (automático / escuro / claro) antes de mostrar a página -->
  <script src="js/theme.js"></script>
</head>
<body>
  <header>
    <div class="head-row">
      <div class="brand">
        <span class="logo" aria-hidden="true">⚽</span>
        <div>
          <h1>Jogos ao Vivo</h1>
          <p class="sub">Horários de Portugal · canais do Brasil</p>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-view="aovivo">Jogos <span class="badge" hidden></span></button>
      <button type="button" class="tab" role="tab" data-view="resultados">Resultados</button>
      <button type="button" class="tab" role="tab" data-view="campeonatos">Ligas</button>
      <button type="button" class="tab" role="tab" data-view="calendario">Calendário</button>
      <button type="button" class="tab" role="tab" data-view="filmes">Filmes</button>
    </nav>
  </header>
  <section id="update" class="update" role="status" hidden></section>
  <main id="content"></main>
  <footer>
    <p id="status"></p>
    <button id="refresh" type="button">Atualizar</button>
    <div id="settings" class="settings" aria-label="Ajustes"></div>
  </footer>
  <!-- config.js é criado pelo GitHub Actions com a chave guardada em Secrets -->
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
