name: Diagnóstico

on:
  workflow_dispatch:
  push:
    branches: [claude/apk-download-request-wjf5m3]

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar as fontes de dados
        run: node tools/diagnostico.mjs && node tools/sondar.mjs
