name: Diagnóstico

on:
  workflow_dispatch:
  push:
    branches: [claude/apk-download-request-wjf5m3, canais-fontes]
    paths: ['tools/**', '.github/workflows/diagnostico.yml']

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sonda dos canais (fontes alternativas)
        run: node tools/sonda-canais.mjs
